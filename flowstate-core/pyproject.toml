[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "flowstate-asof-core"
version = "0.1.0"
description = "Rust as-of join / streaming alignment kernel for FlowState (import name: flowstate_core)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyarrow>=14.0"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Repository = "https://github.com/RyanJHamby/flowstate"

[tool.maturin]
module-name = "flowstate_core"
# abi3: one wheel per platform covers CPython 3.11+
features = ["pyo3/extension-module", "pyo3/abi3-py311", "python"]
